<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MediaDash</title>
<meta name="theme-color" content="#0d111c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MediaDash">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<header>
  <div class="brand"><svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg> MediaDash</div>
  <div class="speeds"><span id="dl">–</span> ↓ <span id="up">–</span> ↑</div>
</header>
<div id="errors"></div>
<div class="searchbar">
  <div class="toggle">
    <button id="tab-series" class="on">TV</button>
    <button id="tab-movie">Movies</button>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="Search shows or movies…" autocomplete="off">
    <button id="go">Search</button>
  </div>
</div>
<div id="results" class="cards"></div>
<main>
  <section data-section="downloads">
    <h2>Downloads <span class="count" id="qb-count"></span></h2>
    <div id="torrents" class="cards"><p class="empty">Loading…</p></div>
  </section>
  <section data-section="sonarr">
    <h2>Sonarr <span class="count" id="sonarr-count"></span></h2>
    <div id="sonarr" class="cards"><p class="empty">Loading…</p></div>
  </section>
  <section data-section="radarr">
    <h2>Radarr <span class="count" id="radarr-count"></span></h2>
    <div id="radarr" class="cards"><p class="empty">Loading…</p></div>
  </section>
</main>
<footer>
  <button id="refresh">⟳ Refresh</button>
  <span id="updated"></span>
</footer>
<script src="app.js?v=3"></script>
</body>
</html>
